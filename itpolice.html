<style>
/* Layout: single centered column, answer-sheet feel: lettered bubbles ก ข ค ง, thin ruled lines, navy ink on cool paper */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --ink: #12213a;
  --muted: #55627a;
  --line: #d3dae6;
  --accent: #1f3b73;
  --on-accent: #ffffff;
  --sel: #e5ebf8;
  --gold: #9a6410;
  --good: #1b7a45;
  --good-bg: #e3f4ea;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1526; --surface: #172039; --ink: #e8edf7; --muted: #9aa8c2; --line: #2a3757;
    --accent: #8fb0ff; --on-accent: #0e1526; --sel: #1e2d52; --gold: #e0a93b;
    --good: #5fd08d; --good-bg: #123022; --bad: #ff8a80; --bad-bg: #3a1b1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1526; --surface: #172039; --ink: #e8edf7; --muted: #9aa8c2; --line: #2a3757;
  --accent: #8fb0ff; --on-accent: #0e1526; --sel: #1e2d52; --gold: #e0a93b;
  --good: #5fd08d; --good-bg: #123022; --bad: #ff8a80; --bad-bg: #3a1b1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 14px; letter-spacing: .04em; color: var(--gold); font-weight: 600; }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* home */
.head { display: grid; gap: 8px; padding: 12px 0 20px; }
.head h1 { font-size: clamp(26px, 6vw, 36px); }
.head p { margin: 0; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; margin-bottom: 14px; }
.panel h2 { font-size: 18px; }
.opts { display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-height: 48px;
}
.row[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent); }
.row .grow { flex: 1; min-width: 0; }
.row .count { color: var(--muted); font-size: 15px; white-space: nowrap; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.row[aria-pressed="true"] .dot { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg .row { flex-direction: column; align-items: flex-start; gap: 2px; }
.seg small { color: var(--muted); font-size: 14px; line-height: 1.4; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.btn {
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px;
  padding: 12px 20px; min-height: 48px; font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; font-size: 18px; }
.resume { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-color: var(--gold); }
.resume > div { min-width: 0; }
details.cheat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; }
details.cheat summary { cursor: pointer; padding: 12px 0; font-weight: 600; min-height: 44px; }
.tablewrap { overflow-x: auto; padding-bottom: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 360px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 16px; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 14px; }
td:first-child { font-weight: 600; white-space: nowrap; }
.note { font-size: 14px; color: var(--muted); margin-top: 14px; }

/* quiz */
.top { display: grid; gap: 10px; margin-bottom: 14px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 8px 0 10px; z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.topline strong { font-family: var(--font-display); font-weight: 600; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 8px 4px; min-height: 40px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 18px; display: grid; gap: 16px; }
.chip { justify-self: start; font-size: 14px; color: var(--gold); border: 1px solid currentColor; border-radius: 99px; padding: 1px 12px; font-weight: 600; }
.qtext { font-size: 20px; line-height: 1.55; margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 52px;
}
.choice .bub {
  flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--muted);
  display: grid; place-items: center; font-weight: 600; font-size: 16px; color: var(--muted);
}
.choice .txt { padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice.sel { border-color: var(--accent); background: var(--sel); }
.choice.sel .bub { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.choice.ok { border-color: var(--good); background: var(--good-bg); }
.choice.ok .bub { background: var(--good); border-color: var(--good); color: var(--surface); }
.choice.no { border-color: var(--bad); background: var(--bad-bg); }
.choice.no .bub { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.choice[disabled] { cursor: default; }
.fb { margin: 0; padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.navrow { display: flex; gap: 10px; margin-top: 14px; }
.navrow .btn { flex: 1; }
details.jump { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; }
details.jump summary { cursor: pointer; padding: 10px 0; min-height: 44px; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; padding-bottom: 14px; }
.cell { min-height: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.cell.cur { box-shadow: 0 0 0 2px var(--accent); }
.cell.a { background: var(--sel); border-color: var(--accent); }
.cell.ok { background: var(--good-bg); border-color: var(--good); }
.cell.no { background: var(--bad-bg); border-color: var(--bad); }
.confirm { border-color: var(--gold); }
.confirm .navrow { margin-top: 0; }

/* result */
.score { display: grid; gap: 4px; justify-items: start; }
.score .big { font-family: var(--font-display); font-weight: 600; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 24px; color: var(--muted); font-weight: 500; }
.cat { display: grid; gap: 6px; }
.cat .l { display: flex; justify-content: space-between; gap: 12px; }
.cat .l span:first-child { min-width: 0; }
.cat .bar { height: 10px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 16px; min-height: 40px; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.rev { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 6px; }
.rev:first-child { border-top: 0; }
.rev p { margin: 0; overflow-wrap: anywhere; }
.rev .no { color: var(--bad); }
.rev .ok { color: var(--good); }
.rev .n { font-family: var(--font-display); font-weight: 600; }
.actions { display: grid; gap: 10px; }
@media (min-width: 560px) { .actions { grid-template-columns: 1fr 1fr; } }
@media (max-width: 440px) { .seg { grid-template-columns: 1fr; } .qtext { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s ease; } }
</style>

];
const CHEAT = [
  ["CPU","ประมวลผลและควบคุม"],["RAM","หน่วยความจำชั่วคราว (ปิดเครื่องแล้วหาย)"],["ROM","หน่วยความจำไม่ลบเลือน"],
  ["1 Byte","8 Bit"],["1 KB","1,024 Byte"],["Windows","ระบบปฏิบัติการ"],["Word","ประมวลผลคำ"],
  ["Excel","ตารางคำนวณ"],["PowerPoint","งานนำเสนอ"],["SUM","ผลรวม"],["AVERAGE","ค่าเฉลี่ย"],
  ["MAX / MIN","ค่าสูงสุด / ต่ำสุด"],["LAN / MAN / WAN","เครือข่ายตามขอบเขตพื้นที่"],["Router","กำหนดเส้นทางข้อมูล"],
  ["Switch","เชื่อมต่ออุปกรณ์ใน LAN"],["DNS","แปลงชื่อโดเมนเป็น IP"],["HTTPS","สื่อสารบนเว็บโดยเข้ารหัส TLS"],
  ["Phishing","หลอกขโมยข้อมูล"],["2FA","ยืนยันตัวตนสองปัจจัย"]
];
const LET = ["ก", "ข", "ค", "ง"];
const KEY = "nst-ak-quiz-v1";
const byId = {}; Q.forEach(q => byId[q.id] = q);
const app = document.getElementById("app");
let S = null, view = "home", cfg = { scope: "all", mode: "practice", shuffle: false }, confirming = false, filter = "all";

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function drop() { try { localStorage.removeItem(KEY); } catch (e) {} }
function scopeIds(scope) { return Q.filter(q => scope === "all" || q.cat === scope).map(q => q.id); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function scopeName(s) { return s === "all" ? "ทุกหมวด" : s === "retry" ? "ทบทวนข้อที่พลาด" : CATS[s - 1].name; }

function start(ids, scope) {
  S = { order: cfg.shuffle ? shuffle(ids) : ids, ans: {}, idx: 0, mode: cfg.mode, scope, done: false };
  confirming = false; view = "quiz"; save(); render();
}

function render() {
  if (view === "home") home(); else if (view === "quiz") quiz(); else result();
  window.scrollTo(0, 0);
}

function home() {
  const saved = load();
  let resume = "";
  if (saved && !saved.done && saved.order) {
    const n = Object.keys(saved.ans).length;
    resume = `<div class="panel resume"><div><strong>ทำค้างไว้</strong><div class="muted">${esc(scopeName(saved.scope))} · ตอบแล้ว ${n} จาก ${saved.order.length} ข้อ</div></div><button class="btn" id="resume">ทำต่อ</button></div>`;
  }
  const scopes = [["all", "ทุกหมวด", Q.length]].concat(CATS.map(c => [c.id, `หมวด ${c.id} ${c.name}`, Q.filter(q => q.cat === c.id).length]));
  app.innerHTML = `
    <header class="head">
      <div class="eyebrow">สำนักงานตำรวจแห่งชาติ · สายอำนวยการ (อก.)</div>
      <h1>ข้อสอบนายสิบตำรวจ ความรู้คอมพิวเตอร์และ IT</h1>
      <p>${Q.length} ข้อ ข้อละ 1 คะแนน ตัวเลือก ก. ข. ค. ง.</p>
    </header>
    ${resume}
    <section class="panel">
      <h2>เลือกชุดที่จะทำ</h2>
      <div class="opts">${scopes.map(s => `<button class="row" data-scope="${s[0]}" aria-pressed="${String(cfg.scope) === String(s[0])}"><span class="dot"></span><span class="grow">${esc(s[1])}</span><span class="count tnum">${s[2]} ข้อ</span></button>`).join("")}</div>
    </section>
    <section class="panel">
      <h2>รูปแบบการทำ</h2>
      <div class="seg">
        <button class="row" data-mode="practice" aria-pressed="${cfg.mode === "practice"}"><strong>ฝึกทำ</strong><small>ตอบแล้วรู้เฉลยทันที</small></button>
        <button class="row" data-mode="exam" aria-pressed="${cfg.mode === "exam"}"><strong>จำลองสอบ</strong><small>เปลี่ยนคำตอบได้ ดูเฉลยตอนส่ง</small></button>
      </div>
      <label class="check"><input type="checkbox" id="shuf" ${cfg.shuffle ? "checked" : ""}> สลับลำดับข้อ</label>
    </section>
    <button class="btn block" id="go">เริ่มทำข้อสอบ</button>
    <details class="cheat" style="margin-top:14px">
      <summary>สรุปหัวข้อที่ควรจำก่อนสอบ</summary>
      <div class="tablewrap"><table><thead><tr><th>หัวข้อ</th><th>สิ่งที่ต้องจำ</th></tr></thead><tbody>
        ${CHEAT.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}
      </tbody></table></div>
    </details>
    <p class="note">ชุดนี้เป็นข้อสอบจำลองที่จัดทำตามหัวข้อที่กำหนด ไม่ใช่ข้อสอบจริง และไม่ได้ยืนยันว่าเคยออกสอบของสำนักงานตำรวจแห่งชาติ</p>`;
  app.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { const v = b.dataset.scope; cfg.scope = v === "all" ? "all" : +v; home(); });
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { cfg.mode = b.dataset.mode; home(); });
  document.getElementById("shuf").onchange = e => { cfg.shuffle = e.target.checked; };
  document.getElementById("go").onclick = () => start(scopeIds(cfg.scope), cfg.scope);
  const r = document.getElementById("resume");
  if (r) r.onclick = () => { S = saved; confirming = false; view = "quiz"; render(); };
}

function quiz() {
  const total = S.order.length, q = byId[S.order[S.idx]], a = S.ans[q.id];
  const practice = S.mode === "practice", locked = practice && a !== undefined;
  const answered = Object.keys(S.ans).length;
  const last = S.idx === total - 1;
  const opts = q.o.map((t, i) => {
    let cls = "choice";
    if (locked) { if (i === q.a) cls += " ok"; else if (i === a) cls += " no"; }
    else if (a === i) cls += " sel";
    return `<button class="${cls}" data-i="${i}" ${locked ? "disabled" : ""}><span class="bub">${LET[i]}</span><span class="txt">${esc(t)}</span></button>`;
  }).join("");
  const fb = locked ? (a === q.a
    ? `<p class="fb ok" role="status">ถูกต้อง</p>`
    : `<p class="fb no" role="status">ตอบผิด เฉลยคือ ${LET[q.a]}. ${esc(q.o[q.a])}</p>`) : "";
  const cells = S.order.map((id, k) => {
    const x = S.ans[id]; let c = "cell";
    if (x !== undefined) c += practice ? (x === byId[id].a ? " ok" : " no") : " a";
    if (k === S.idx) c += " cur";
    return `<button class="${c}" data-k="${k}" aria-label="ข้อ ${k + 1}">${k + 1}</button>`;
  }).join("");
  const unans = total - answered;
  const conf = confirming ? `
    <div class="panel confirm" role="alertdialog" aria-label="ยืนยันการส่ง">
      <strong>${unans > 0 ? `ยังไม่ได้ตอบ ${unans} ข้อ ข้อที่ไม่ตอบจะไม่ได้คะแนน` : "ตอบครบทุกข้อแล้ว"}</strong>
      <div class="navrow"><button class="btn ghost" id="back">กลับไปทำต่อ</button><button class="btn" id="submit">ส่งและดูผล</button></div>
    </div>` : "";
  app.innerHTML = `
    <div class="top">
      <div class="topline"><strong class="tnum">ข้อ ${S.idx + 1} / ${total}</strong><span class="muted tnum">ตอบแล้ว ${answered}</span><button class="link" id="quit">กลับหน้าแรก</button></div>
      <div class="bar" aria-hidden="true"><i style="width:${(answered / total) * 100}%"></i></div>
    </div>
    <article class="qcard">
      <span class="chip">หมวด ${q.cat} ${esc(CATS[q.cat - 1].name)}</span>
      <p class="qtext">${esc(q.q)}</p>
      <div class="choices">${opts}</div>
      ${fb}
    </article>
    <div class="navrow">
      <button class="btn ghost" id="prev" ${S.idx === 0 ? "disabled" : ""}>ข้อก่อนหน้า</button>
      ${last ? `<button class="btn" id="fin">ส่งข้อสอบ</button>` : `<button class="btn" id="next">ข้อถัดไป</button>`}
    </div>
    ${conf}
    <details class="jump"><summary>ไปยังข้อที่ต้องการ</summary><div class="grid">${cells}</div></details>`;
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => { if (locked) return; S.ans[q.id] = +b.dataset.i; save(); const y = window.scrollY; quiz(); window.scrollTo(0, y); });
  app.querySelectorAll(".cell").forEach(b => b.onclick = () => { S.idx = +b.dataset.k; confirming = false; save(); quiz(); });
  const go = d => { S.idx += d; confirming = false; save(); quiz(); };
  const p = document.getElementById("prev"), n = document.getElementById("next"), f = document.getElementById("fin");
  if (p) p.onclick = () => go(-1);
  if (n) n.onclick = () => go(1);
  if (f) f.onclick = () => { confirming = true; quiz(); window.scrollTo(0, document.body.scrollHeight); };
  document.getElementById("quit").onclick = () => { save(); view = "home"; render(); };
  const bk = document.getElementById("back"), sb = document.getElementById("submit");
  if (bk) bk.onclick = () => { confirming = false; quiz(); };
  if (sb) sb.onclick = () => { S.done = true; save(); filter = "all"; view = "result"; render(); };
}

function result() {
  const total = S.order.length;
  const rows = S.order.map((id, k) => { const q = byId[id], a = S.ans[id]; return { k, q, a, st: a === undefined ? "skip" : a === q.a ? "ok" : "no" }; });
  const right = rows.filter(r => r.st === "ok").length;
  const pct = Math.round((right / total) * 100);
  const msg = pct >= 80 ? "พร้อมสอบ ทบทวนข้อที่พลาดอีกรอบแล้วไปต่อได้" : pct >= 60 ? "ใกล้เป้าหมาย ทบทวนข้อที่พลาดแล้วลองทำซ้ำ" : "ควรอ่านทบทวนเนื้อหาแล้วทำใหม่อีกครั้ง";
  const cats = CATS.map(c => {
    const rs = rows.filter(r => r.q.cat === c.id); if (!rs.length) return "";
    const ok = rs.filter(r => r.st === "ok").length;
    return `<div class="cat"><div class="l"><span>หมวด ${c.id} ${esc(c.name)}</span><strong class="tnum">${ok}/${rs.length}</strong></div><div class="bar"><i style="width:${(ok / rs.length) * 100}%"></i></div></div>`;
  }).join("");
  const miss = rows.filter(r => r.st !== "ok");
  const list = rows.filter(r => filter === "all" || (filter === "no" && r.st === "no") || (filter === "skip" && r.st === "skip"));
  const nNo = rows.filter(r => r.st === "no").length, nSkip = rows.filter(r => r.st === "skip").length;
  app.innerHTML = `
    <header class="head"><div class="eyebrow">ผลการทำข้อสอบ · ${esc(scopeName(S.scope))}</div></header>
    <section class="panel">
      <div class="score"><div class="big">${right}<small> / ${total}</small></div><div class="muted tnum">คิดเป็น ${pct}%</div></div>
      <p style="margin:0">${msg}</p>
      ${cats}
    </section>
    <div class="actions">
      <button class="btn" id="retry" ${miss.length ? "" : "disabled"}>ทำเฉพาะข้อที่พลาด (${miss.length})</button>
      <button class="btn ghost" id="home">กลับหน้าแรก</button>
    </div>
    <section class="panel" style="margin-top:14px">
      <h2>ทบทวนรายข้อ</h2>
      <div class="tabs">
        <button class="tab" data-f="all" aria-pressed="${filter === "all"}">ทั้งหมด ${total}</button>
        <button class="tab" data-f="no" aria-pressed="${filter === "no"}">ตอบผิด ${nNo}</button>
        <button class="tab" data-f="skip" aria-pressed="${filter === "skip"}">ไม่ได้ตอบ ${nSkip}</button>
      </div>
      <div>${list.length ? list.map(r => `
        <div class="rev">
          <p><span class="n tnum">ข้อ ${r.k + 1}</span> ${esc(r.q.q)}</p>
          <p class="${r.st === "ok" ? "ok" : "no"}">${r.st === "skip" ? "ไม่ได้ตอบ" : `คำตอบของคุณ ${LET[r.a]}. ${esc(r.q.o[r.a])}`}</p>
          ${r.st === "ok" ? "" : `<p class="ok">เฉลย ${LET[r.q.a]}. ${esc(r.q.o[r.q.a])}</p>`}
        </div>`).join("") : `<p class="muted">ไม่มีข้อในรายการนี้</p>`}</div>
    </section>`;
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.f; const y = window.scrollY; result(); window.scrollTo(0, y); });
  document.getElementById("home").onclick = () => { drop(); view = "home"; render(); };
  document.getElementById("retry").onclick = () => { cfg.mode = S.mode; start(miss.map(r => r.q.id), "retry"); };
}

document.addEventListener("keydown", e => {
  if (view !== "quiz" || !S || e.target.tagName === "INPUT") return;
  const q = byId[S.order[S.idx]];
  if (e.key >= "1" && e.key <= "4") { const b = app.querySelector(`.choice[data-i="${+e.key - 1}"]`); if (b) b.click(); }
  else if (e.key === "ArrowRight") { const b = document.getElementById("next"); if (b) b.click(); }
  else if (e.key === "ArrowLeft") { const b = document.getElementById("prev"); if (b && !b.disabled) b.click(); }
});

render();
</script>

</body></html>
