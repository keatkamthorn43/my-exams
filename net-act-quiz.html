*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:22px;box-shadow:0 8px 24px #0000000a;margin-bottom:18px}.hero{background:linear-gradient(135deg,#172554,#1d4ed8);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e8eef8;color:#172033}.danger{background:#fee2e2;color:#991b1b}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #cbd5e1;background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer}.chip.on{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#64748b}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}.choice{display:block;width:100%;text-align:left;border:1px solid #d7dee9;background:#fff;border-radius:13px;padding:14px;margin:10px 0;cursor:pointer;font-size:16px}.choice:hover{background:#f8fafc}.choice.correct{background:#dcfce7;border-color:#22c55e}.choice.wrong{background:#fee2e2;border-color:#ef4444}.choice.disabled{cursor:default}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:13px}.hide{display:none}.score{font-size:42px;font-weight:800}.wrongItem{padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:10px 0}.small{font-size:13px}.sticky{position:sticky;top:10px;z-index:2;background:#fff;padding:10px 0}.explain{background:#f8fafc;border-left:4px solid #2563eb;padding:12px;border-radius:8px;margin-top:12px}
</style></head><body><div class="wrap"><div class="card hero"><h1>ข้อสอบเครือข่ายคอมพิวเตอร์</h1><p>จากข้อมูลในไฟล์ที่ส่งมา • 319 ข้อ • พร้อมเฉลยและคำอธิบาย</p></div><section id="setup" class="card"><h2>ตั้งค่าการทำข้อสอบ</h2><div class="grid"><div><label>จำนวนข้อ<br><select id="len" style="padding:10px;border-radius:10px;width:100%"><option value="all">ทั้งหมด 319 ข้อ</option><option value="20">20 ข้อ</option><option value="50">50 ข้อ</option><option value="100">100 ข้อ</option></select></label></div><div><label>โหมด<br><select id="mode" style="padding:10px;border-radius:10px;width:100%"><option value="instant">ฝึกทำ — เฉลยทันที</option><option value="exam">สอบ — เฉลยเมื่อจบ</option></select></label></div></div><h3>เลือกหมวด</h3><div id="cats" class="chips"></div><p class="muted small">ไม่เลือกหมวด = สุ่มจากทุกหมวด</p><div class="row"><button id="start" class="btn primary">เริ่มทำข้อสอบ</button></div></section><section id="quiz" class="hide"><div class="card sticky"><div class="row"><span id="qnum"></span><span id="cat" class="tag"></span><span style="margin-left:auto" id="pct"></span></div><div class="progress"><div id="bar" class="bar"></div></div></div><div class="card"><h2 id="question"></h2><div id="choices"></div><div id="feedback"></div><div class="row" style="margin-top:16px"><button id="next" class="btn primary hide">ข้อถัดไป</button><button id="finish" class="btn secondary hide">จบข้อสอบ</button></div></div></section><section id="result" class="hide"><div class="card"><h2>ผลการสอบ</h2><div id="score" class="score"></div><p id="summary"></p><div id="breakdown"></div></div><div class="card"><h2>ทบทวนข้อที่ตอบผิด</h2><div id="wrong"></div><div class="row"><button id="retry" class="btn primary">ทำข้อที่ผิดอีกครั้ง</button><button id="home" class="btn secondary">กลับหน้าหลัก</button></div></div></section></div><script>
const QUESTIONS=[{"id": 1, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "การนำคอมพิวเตอร์หลายๆ เครื่องเชื่อมเข้าด้วยกัน ก่อให้เกิดผลตามข้อใด", "c": ["Computer Network", "Client", "Server", "Hub"], "a": 0, "e": "การเชื่อมต่อคอมพิวเตอร์หลายเครื่องเข้าด้วยกันเพื่อแลกเปลี่ยนข้อมูลและทรัพยากรเรียกว่า เครือข่ายคอมพิวเตอร์ (Computer Network)"}, {"id": 2, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "ข้อใดต่อไปนี้ มิได้จัดอยู่ในส่วนประกอบของระบบสื่อสารข้อมูล", "c": ["Message", "Protocol", "Hacker", "Sender/Receiver"], "a": 2, "e": "องค์ประกอบพื้นฐานระบบสื่อสารข้อมูลมี 5 ส่วน ได้แก่ ผู้ส่ง, ผู้รับ, ข่าวสาร, สื่อกลาง และโพรโทคอล (Hacker คือผู้บุกรุก ไม่ใช่องค์ประกอบ)"}, {"id": 3, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "โพรโทคอล ตรงกับความหมายตามข้อใด", "c": ["รูปแบบการเขียนภาษาคอมพิวเตอร์", "สื่อกลางที่นำมาใช้สำหรับสื่อสาร", "กฎเกณฑ์หรือข้อตกลงที่นำมาใช้สื่อสาร", "รูปแบบการเชื่อมต่อเครือข่าย"], "a": 2, "e": "Protocol คือกฎระเบียบหรือข้อตกลงที่ใช้อธิบายวิธีการสื่อสารระหว่างอุปกรณ์เครือข่าย"}, {"id": 4, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "โพรโทคอล สามารถนำไปเปรียบเทียบกับข้อใด", "c": ["หน่วยความจำ", "ภาษาที่ใช้สื่อสาร", "คอมไพเลอร์", "ถูกทั้งข้อ ข. และ ค."], "a": 1, "e": "เปรียบเสมือนภาษากลางที่มนุษย์ใช้ตกลงกันเพื่อให้สื่อสารเข้าใจตรงกัน"}, {"id": 5, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "ข่าวสารที่สื่อสารกันบนเครือข่าย จะถูกลำเลียงผ่านสิ่งใด", "c": ["สายสัญญาณ", "คลื่นวิทยุ", "สื่อกลางส่งข้อมูล", "เป็นไปได้ทุกข้อ"], "a": 3, "e": "ข่าวสารสามารถส่งผ่านสื่อกลางได้ทั้งแบบใช้สาย (สายสัญญาณ) และไร้สาย (คลื่นวิทยุ)"}, {"id": 6, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "คุณสมบัติ 4 ประการของระบบสื่อสารข้อมูล ประกอบด้วยอะไรบ้าง", "c": ["Delivery, Accuracy, Source, Destination", "Message, Sender, Receiver, Protocol", "Delivery, Accuracy, Timliness, Jitter", "ผิดทุกข้อ"], "a": 2, "e": "ประสิทธิภาพระบบต้องพิจารณาการส่งมอบ, ความถูกต้อง, ความตรงต่อเวลา และความสม่ำเสมอของความหน่วง (Jitter)"}, {"id": 7, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "การสนทนาผ่านโทรศัพท์ จัดเป็นการสื่อสารที่เป็นไปตามทิศทางการไหลของข้อมูลตามข้อใด", "c": ["Simplex", "Half-Duplex", "Multiplex", "Full-Duplex"], "a": 3, "e": "Full-Duplex คือการรับส่งข้อมูลสวนทางกันได้พร้อมกันในเวลาเดียวกัน เช่น การคุยโทรศัพท์"}, {"id": 8, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "อุปกรณ์โทรคมนาคมตามข้อใด ที่ประเทศไทยได้ยกเลิกการบริการแล้ว", "c": ["โทรเลข", "โทรสาร", "โทรศัพท์", "โทรทัศน์"], "a": 0, "e": "บริการโทรเลขในไทยถูกยกเลิกการให้บริการไปอย่างเป็นทางการแล้ว"}, {"id": 9, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "จากข้อที่ 8 อุปกรณ์โทรคมนาคมดังกล่าวสามารถเทียบได้กับเทคโนโลยีใดในปัจจุบัน", "c": ["LAN", "SMS", "Pager", "ถูกทั้งข้อ ข. และ ค."], "a": 2, "e": "โทรเลขใช้ส่งข้อความสั้นตัวอักษร เทียบได้กับระบบเพจเจอร์ (Pager) ในอดีต"}, {"id": 10, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "Line-of-sight เกี่ยวข้องกับการสื่อสารตามข้อใด", "c": ["Telephone", "Microwave", "Radio", "Infrared"], "a": 1, "e": "ไมโครเวฟเป็นการส่งสัญญาณแบบมองเห็นเส้นตรง (Line-of-sight) ระหว่างสถานี"}, {"id": 11, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "ก่อนที่จะมีเครือข่าย การคัดลอกข้อมูลจากส่วนงานอื่นๆ เพื่อนำมาใช้งาน เรียกว่าอะไร", "c": ["Snookernet", "Sneakernet", "Internet", "LAN"], "a": 1, "e": "Sneakernet เป็นคำเสียดสีหมายถึงการเดินถือแผ่นดิสก์ไปส่งข้อมูลด้วยตนเอง"}, {"id": 12, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "ข้อใดต่อไปนี้ มิใช่ประโยชน์ของเครือข่าย", "c": ["การแบ่งปันการใช้งานทรัพยากรร่วมกัน", "ช่วยลดค่าใช้จ่าย", "คอมพิวเตอร์ทำงานได้รวดเร็วขึ้น", "ทำให้สื่อสารได้สะดวกยิ่งขึ้น"], "a": 2, "e": "เครือข่ายไม่ได้ช่วยให้ความเร็วประมวลผลของคอมพิวเตอร์แต่ละเครื่องเพิ่มขึ้นโดยตรง"}, {"id": 13, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "เวลาที่ใช้ขนส่งข้อมูลและเวลาตอบสนอง เป็นเกณฑ์วัดประสิทธิภาพของเครือข่ายตามข้อใด", "c": ["Performance", "Reliability", "Security", "Recovery"], "a": 0, "e": "Performance (สมรรถนะ) วัดจากเวลาในการขนส่งและเวลาตอบสนอง"}, {"id": 14, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "กรณีเครือข่ายล่ม แล้วสามารถกู้คืนระบบได้อย่างรวดเร็ว ตรงกับเกณฑ์วัดประสิทธิภาพของเครือข่ายตามข้อใด", "c": ["Performance", "Reliability", "Security", "Recovery"], "a": 3, "e": "Recovery คือความสามารถในการกู้คืนระบบเมื่อเกิดความเสียหาย"}, {"id": 15, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "ข้อใดต่อไปนี้ คือวัตถุประสงค์ของมาตรฐาน", "c": ["เพื่อให้อุปกรณ์สามารถส่งสัญญาณไปยังอุปกรณ์อื่นๆ ได้", "เพื่อให้อุปกรณ์ต่างๆ สามารถใช้งานเข้ากันได้ และเชื่อมต่อระหว่างกันได้", "เพื่อสร้างความมั่นใจถึงสื่อกลางที่สามารถทำงานเฉพาะด้านได้", "ถูกทุกข้อ"], "a": 1, "e": "มาตรฐานทำให้ผลิตภัณฑ์จากต่างค่ายสามารถนำมาเชื่อมต่อและทำงานร่วมกันได้"}, {"id": 16, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "กรณีบริษัท IBM ได้กำหนดมาตรฐานขึ้นมาเพื่อใช้งานบนเครือข่ายของ IBM เอง จัดอยู่ในมาตรฐานตามข้อใด", "c": ["OSI Model", "De Facto", "De Jure", "ถูกทั้งข้อ ก. และ ข."], "a": 1, "e": "De Facto คือมาตรฐานที่เกิดจากการใช้งานจริงหรือกำหนดโดยองค์กรเพื่อใช้ในระบบตนเองก่อนรับรองสากล"}, {"id": 17, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "องค์กรตามข้อใด กำกับดูแลมาตรฐานเครือข่ายท้องถิ่น", "c": ["IEEE", "ITU-T", "ANSI", "ISO"], "a": 0, "e": "IEEE เป็นองค์กรที่ดูแลมาตรฐานด้านเครือข่ายท้องถิ่น (LAN)"}, {"id": 18, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "บริษัทแห่งหนึ่งมีสำนักงานใหญ่ตั้งอยู่ที่ประเทศอังกฤษ และมีสาขาย่อยๆ ซึ่งตั้งอยู่ในแถบยุโรปและเอเชีย เมื่อต้องการเชื่อมต่อสาขาต่างๆ เข้ากับสำนักงานใหญ่ จะต้องเชื่อมโยงเครือข่ายตามข้อใด", "c": ["LAN", "WAN", "MAN", "เป็นไปได้ทุกข้อ"], "a": 1, "e": "การเชื่อมต่อระยะไกลข้ามประเทศ/ทวีป คือ WAN (Wide Area Network)"}, {"id": 19, "cat": "พื้นฐานการสื่อสารข้อมูลและเครือข่าย", "q": "กรณีสำนักงานมีคอมพิวเตอร์อยู่จำนวน 10 เครื่อง และเครื่องพิมพ์ 2 เครื่อง หากต้องการเชื่อมโยงคอมพิวเตอร์และอุปกรณ์เข้าด้วยกัน เพื่อให้พนักงานสามารถใช้ทรัพยากรร่วมกันได้ ควรเชื่อมโยงเครือข่ายตามข้อใด", "c": ["LAN", "WAN", "MAN", "เป็นไปได้ทุกข้อ"], "a": 0, "e": "การเชื่อมต่อภายในอาคารหรือพื้นที่จำกัดเดียวกันคือ LAN"}, {"id": 20, "cat": "พื eways"], "a": 1, "e": "Packet Switches ทำหน้าที่เสมือนคอมพิวเตอร์หรือโปรเซสเซอร์ความเร็วสูงในการจัดการสวิตชิ่งแพ็กเก็ต"}, {"id": 77, "cat": "โครงสร้างเครือข่ายและอุปกรณ์", "q": "อุปกรณ์ใดต่อไปนี้ มีลักษณะการทำงานในรูปแบบเก็บแล้วส่งต่อ (Store and Forward)", "c": ["Hubs", "Switches", "Packet Switches", "ถูกทั้งข้อ ข. และ ค."], "a": 3, "e": "อุปกรณ์ประเภท Switch และ Packet Switch จะรับข้อมูลมาเก็บไว้ตรวจสอบความถูกต้องก่อนส่งต่อ (Store and Forward)"}, {"id": 78, "cat": "โครงสร้างเครือข่ายและอุปกรณ์", "q": "เครือข่ายตามข้อใด เวลาส่งข้อมูลจะถือครองเส้นทางตลอดระยะเวลาที่มีการสื่อสาร", "c": ["Circuit Switching", "Message Switching", "Packet Switching", "ไม่มีข้อถูก"], "a": 0, "e": "Circuit Switching (เช่น ระบบโทรศัพท์ดั้งเดิม) จะจองเส้นทางยาวต่อเนื่องตลอดการสนทนา"}, {"id": 79, "cat": "โครงสร้างเครือข่ายและอุปกรณ์", "q": "เครือข่ายตามข้อใด จะถือครองเส้นทางในการส่งข้อมูลช่วงเวลาหนึ่งเท่านั้น ไม่ได้จับจองตลอดระยะเวลาสื่อสาร ทำให้ผู้อื่นสามารถใช้เส้นทางนี้ในการลำเลียงข้อมูลได้", "c": ["Circuit Switching", "Message Switching", "Packet Switching", "ถูกทั้งข้อ ข. และ ค."], "a": 2, "e": "Packet Switching จะแบ่งข้อมูลเป็นแพ็กเก็ตย่อยแล้วส่งสลับใช้เส้นทางร่วมกัน ไม่จองแชแนลถาวร"}, {"id": 80, "cat": "โครงสร้างเครือข่ายและอุปกรณ์", "q": "เครือข่ายตามข้อใด จะสร้างวงจรสมมติขึ้นมา เสมือนเป็นเส้นทางจริงเพื่อเชื่อมโยงจากต้นทางไปยังปลายทาง", "c": ["Circuit Switching", "Message Switching", "TCP/IP", "Virtual-Circuit"], "a": 3, "e": "Virtual-Circuit (วงจรเสมือน) เป็นการสร้างเส้นทางตรรกะเสมือนว่าเชื่อมต่อตรงกันตลอดเวลาในเครือข่ายแบบแพ็กเก็ตสวิตช์"}, {"id": 81, "cat": "สัญญาณและการส่งสัญญาณ", "q": "ข้อใดกล่าวถูกต้อง", "c": ["ข้อมูลสามารถเป็นได้ทั้งข้อมูลแอนะล็อกหรือข้อมูลดิจิทัล", "ข้อมูลต้นฉบับที่จะส่งในระบบสื่อสาร สามารถแปลงมาเป็นสัญญาณดิจิทัลได้เท่านั้น", "สัญญาณสามารถเป็นได้ทั้งสัญญาณแอนะล็อกหรือสัญญาณดิจิทัล", "ถูกทั้งข้อ ก. และ ค."], "a": 3, "e": "ทั้งข้อมูล (Data) และสัญญาณ (Signal) สามารถเป็นได้ทั้งแบบแอนะล็อกและดิจิทัลตามลักษณะการใช้งาน"}, {"id": 82, "cat": "สัญญาณและการส่งสัญญาณ", "q": : ["Bit Error", "Single-Bit Error", "Burst Error", "ถูกทั้งข้อ ข. และ ค."], "a": 1, "e": "สังเกตว่ามีบิตที่ผิดพลาดเปลี่ยนไปเพียงตำแหน่งเดียว (จาก 0 เป็น 1 ที่หลักที่สี่นับจากขวา) เรียกว่า Single-Bit Error"}, {"id": 173, "cat": "การควบคุมและการตรวจสอบข้อผิดพลาด", "q": "หากบิตข้อมูลมีค่าเท่ากับ 1001101011100101 และได้ใช้บิตตรวจสอบแบบ Even Parity ผลที่ได้จะเป็นไปตามข้อใด", "c": ["10011010111001011", "110110101110101", "10011010111001010", "1000001011100101"], "a": 2, "e": "นับจำนวนเลข 1 ในชุดข้อมูล หากเป็นเลขคี่ จะเติมบิต Parity เป็น 1 เพื่อให้ผลรวมเลข 1 กลายเป็นเลขคู่ (Even)"}, {"id": 174, "cat": "การควบคุมและการตรวจสอบข้อผิดพลาด", "q": "การตรวจจับข้อผิดพลาดตามวิธี Parity Checks มีโอกาสตรวจไม่พบข้อผิดพลาดได้จากกรณีใด", "c": ["Single Bit Error", "Burst Error", "Bit Error", "Parity Error"], "a": 1, "e": "หากเกิดความผิดพลาดสลับคู่บิตพร้อมกัน (Burst Error แบบจำนวนบิตคู่ที่ผิด) วิธี Parity ธรรมดาจะไม่สามารถตรวจพบความผิดปกติได้"}, {"id": 175, "cat": "การควบคุมและการตรวจสอบข้อผิดพลาด", "q": "Vertical Errors ซึ่งเป็นข้อเสียที่ทำให้ตรวจไม่พบข้อผิดพลาด เกี่ยวข้องกับวิธีตรวจจับข้อผิดพลาดตามข้อใด", "c": ["Cyclic Redundancy Checksum", "Parity Checks", "Checksum", "ถูกทั้งข้อ ก. และ ค."], "a": 1, "e": "Parity Checks มีข้อจำกัดเรื่องแนวตั้งหรือข้อผิดพลาดแบบกลุ่มที่หักล้างกันเองทำให้ตรวจไม่พบ"}, {"id": 176, "cat": "การควบคุมและการตรวจสอบข้อผิดพลาด", "q": "การตรวจจับข้อผิดพลาดวิธีใดที่มีความน่าเชื่อถือมากที่สุด", "c": ["Cyclic Redundancy Checksum", "Checksum", "CRC", "ถูกทั้งข้อ ก. และ ค."], "a": 3, "e": "Cyclic Redundancy Check (CRC) เป็นวิธีทางคณิตศาสตร์ที่มีความแม่นยำและน่าเชื่อถือสูงมากในการตรวจจับข้อผิดพลาดบิตคู่หรือกลุ่มบิต"}, {"id": 177, "cat": "การควบคุมและการตรวจสอบข้อผิดพลาด", "q": "ค่า G(x) ที่นำมาใช้เป็นตัวหารตามวิธี CRC มักนำเสนอในรูปแบบใด", "c": ["Polynomial", "Binary Bit", "Decimal", "Hexadecimal"], "a": 0, "e": "ค่าตัวหารใน CRC มักเขียนอยู่ในรูปพหุนาม (Polynomial) เช่น `x4+x+1`"}, {"id": 178, "cat": "การควบคุมและการตรวจสอบข้อผิดพลาด", "q": "จากข้อที่ 8 อยากทราบว่ามีข้อ ข้อ"], "a": 3, "e": "AP ยุคใหม่มักรวมฟังก์ชัน Wireless AP, Switch, Router และ Firewall ไว้ในเครื่องเดียว (Wireless Router)"}, {"id": 241, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "หากสถานที่ มีการติดตั้งป้ายตราสัญลักษณ์ว่า \"Wi-Fi Zone\" หมายความว่าอย่างไร", "c": ["เป็นสถานที่ที่ขายอุปกรณ์ไร้สายตามมาตรฐาน IEEE 802.11", "เป็นสถานที่ที่ต้องระมัดระวังเป็นพิเศษ เนื่องจากมีวัตถุไวไฟ", "เป็นสถานที่ที่ให้สมาชิก Wi-Fi นัดพบกัน", "เป็นสถานที่ที่บริการเครือข่ายไร้สายให้แก่ลูกค้าหรือผู้ใช้ทั่วไป"], "a": 3, "e": "หมายถึงพื้นที่ที่มีการเปิดให้บริการสัญญาณอินเทอร์เน็ตไร้สายสำหรับผู้เข้ามาใช้งาน"}, {"id": 242, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "เทคโนโลยี Wireless Ethernet ตามข้อใด มีความเร็วสูงสุด (เทียบตามตัวเลือกมาตรฐานทั่วไป)", "c": ["802.11", "802.11a", "802.11ac (หรือรุ่นสูงกว่าในกลุ่ม)", "802.11n"], "a": 2, "e": "มาตรฐาน 802.11ac ให้ความเร็วสูงระดับ Gigabit ในย่านความถี่ 5 GHz"}, {"id": 243, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "ข้อใดต่อไปนี้ ใช้วิธีการบอร์ดแคสต์แบบ DSSS", "c": ["HomeRF", "802.11b", "802.11g", "ถูกทั้งข้อ ข. และ ค."], "a": 3, "e": "มาตรฐาน 802.11b และ 802.11g ใช้เทคนิคการกระจายคลื่นแบบ DSSS (Direct Sequence Spread Spectrum) ในย่าน 2.4 GHz"}, {"id": 244, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "MIMO เป็นระบบสนับสนุนตามข้อใด", "c": ["การ์ดเครือข่ายแบบหลายการ์ด", "แอกเซสพอยต์ที่มีเสาอากาศหลายต้น (Multiple Input Multiple Output)", "แอกเซสพอยต์ที่รองรับซีพียู", "ถูกทั้งข้อ ข. และ ค."], "a": 1, "e": "MIMO ใช้เสาอากาศหลายต้นทั้งฝั่งส่งและรับเพื่อเพิ่มช่องทางรับส่งข้อมูลให้เร็วและเสถียรขึ้น"}, {"id": 245, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "MU-MIMO เป็นคุณสมบัติตามข้อใด", "c": ["ส่งผ่านข้อมูลชุดไปยังโหนดใดโหนดหนึ่ง", "ส่งผ่านข้อมูลชุดไปยังหลายๆ โหนดได้ในเวลาเดียวกัน ภายใต้คลื่นความถี่เดียวกัน (Multi-User MIMO)", "ส่งผ่านข้อมูลชุดไปยังหลายๆ โหนด หลายๆ ความถี่ได้ในเวลาเดียวกัน ภายใต้คลื่นความถี่เดียวกัน", "เป็นได้ทุกข้อ ข. และ ค."], "a": 1, "e": "MU-MIMO ช่วยให้ AP สามารถสื่อสารรับส่งข้อมูลกับอุปกรณ์หลายเครื่องพร้อมกันได้ในเสี้ยววินาทีเดียว"}, {"id": 246, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "จากข้อที่ 16 อยากทราบว่าคุณสมบัติดังกล่าวตรงตามมาตรฐาน WLAN ตามข้อใด", "c": ["802.11b", "802.11g", "802.11ac (Wave 2)", "802.11n"], "a": 2, "e": "เทคโนโลยี MU-MIMO เริ่มนำมาใช้เต็มรูปแบบในมาตรฐาน 802.11ac (Wave 2)"}, {"id": 247, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "ชั้นสื่อสารใดต่อไปนี้ ไม่เกี่ยวข้องกับมาตรฐาน 802.11", "c": ["PHY", "DCF", "PCF", "Network Layer (OSI Layer 3)"], "a": 3, "e": "มาตรฐาน 802.11 ควบคุมดูแลเฉพาะ Physical และ Data Link Layer ไม่เกี่ยวข้องกับ Network Layer"}, {"id": 248, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "กลไกต่อไปนี้ที่ปรากฏอยู่ใน CSMA/CA แต่จะไม่พบใน CSMA/CD คือข้อใด", "c": ["การตรวจสอบการชนกันของกลุ่มข้อมูล", "การฟังสัญญาณว่าว่างหรือไม่", "การหลีกเลี่ยงการชนกันของกลุ่มข้อมูล (Collision Avoidance / RTS/CTS)", "การตรวจสอบข้อผิดพลาดของแพ็กเก็ต"], "a": 2, "e": "เครือข่ายไร้สายมองไม่เห็นการชนกันตรงๆ จึงต้องใช้ระบบหลีกเลี่ยงการชน (CA) ผ่านการจองสัญญาณ RTS/CTS"}, {"id": 249, "cat": "เครือข่ายไร้สาย (Wireless LAN)", "q": "ปัญหาของ WLAN ที่เกิดจากสถานีหนึ่งไม่ได้รับสัญญาณใดๆ จากอีกหนึ่งสถานี (อยู่คนละมุมไกลกันจนไม่รู้ว่าอีกฝั่งส่งข้อมูลอยู่) คือปัญหาตามข้อใด", "c": ["การหลบหลีกสัญญาณ", "การซ่อนเร้นของสถานี (Hidden Station Problem)", "การหยุดชะงักของสถานี", "ถูกทั้งข้อ ก. และ ข."], "a": 1, "e": "Hidden Node/Station Problem เกิดขึ้นเมื่อเครื่องลูกข่ายอยู่คนละฝั่งของ AP จนมองไม่เห็นกันและเผลอส่งข้อมูลชนกัน"}, {"id": 250, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "มุมมองของ TCP/IP จะมองเครือข่ายที่เชื่อมโยงถึงกันทั้งหมดเป็นไปตามข้อใด", "c": ["มองแต่ละเครือข่ายที่เชื่อมโยงกันทั่วโลก แยกออกจากกันเป็นกลุ่มเครือข่ายย่อย", "มองเครือข่ายที่เชื่อมโยงถึงกันทั้งหมด เสมือนเป็นหนึ่ง Physical Network", "มองเครือข่ายที่เชื่อมโยงถึงกันทั้งหมด เสมือนเป็นหนึ่ง Logical Network", "ถูกทั้งข้อ ข. และ ค."], "a": 2, "e": "สถาปัตยกรรม TCP/IP มองโครงข่ายอินเทอร์เน็ตที่เชื่อมกันทั่วโลกให้เสมือนเป็นเครือข่ายตรรกะเดียวกัน (Logical Network)"}, {"id": 251, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "เครือข่ายตามข้อใด เป็นที่มาของอินเทอร์เน็ตในทุกวันนี้", "c": ["INTRANET", "ARPANET", "LAN", "ถูกทั้งข้อ ก. และ ข."], "a": 1, "e": "ARPANET เป็นเครือข่ายต้นแบบทางทหารและงานวิจัยที่เป็นรากฐานของอินเทอร์เน็ตยุคปัจจุบัน"}, {"id": 252, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "ข้อใดต่อไปนี้ มิใช่ วัตถุประสงค์ของเครือข่ายอาร์พาเน็ต", "c": ["เป็นเครือข่ายให้นักวิจัยสามารถสื่อสารกันได้ แม้อยู่ห่างไกลกัน", "เครือข่ายยังคงสามารถใช้งานได้ ถึงแม้เกิดสงครามนิวเคลียร์ก็ตาม", "เป็นโครงการที่ก่อตั้งขึ้นเพื่อยับยั้งการสงครามนิวเคลียร์โดยตรง", "ทุกข้อเป็นคำตอบที่ถูกต้องตามแนวคิดโครงข่ายสำรอง"], "a": 2, "e": "ARPANET สร้างขึ้นเพื่อการวิจัยและออกแบบระบบสื่อสารสำรองที่ทนทานต่อความเสียหาย ไม่ได้มีหน้าที่ไปยับยั้งสงครามนิวเคลียร์โดยตรง"}, {"id": 253, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "การเชื่อมต่ออินเทอร์เน็ตในรูปแบบใด สามารถเชื่อมต่อแบบออนไลน์ 24 ชั่วโมง โดยไม่ต้องโทรเข้า", "c": ["ADSL", "Leased Line", "Dial-Up", "ถูกทั้งข้อ ก. และ ข."], "a": 3, "e": "ทั้ง ADSL และ Leased Line เป็นการเชื่อมต่อบรอดแบนด์ออนไลน์ตลอดเวลา (Always Online)"}, {"id": 254, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "โพรโทคอลตามข้อใด ที่รับประกันการส่งมอบข้อมูล การแก้ไขข้อผิดพลาด และการกู้คืนแพ็กเก็ตข้อมูลที่เสียหาย", "c": ["TCP (Transmission Control Protocol)", "UDP", "IPX", "ARP"], "a": 0, "e": "TCP เป็นโพรโทคอลแบบเชื่อมต่อที่มีระบบตรวจสอบความถูกต้องและขอส่งซ้ำหากข้อมูลเสียหาย"}, {"id": 255, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "ข้อใดต่อไปนี้ จัดเป็นส่วนประกอบสำคัญของหมายเลขไอพี (IPv4)", "c": ["Network และ Host", "Logical Address และ Physical Address", "Class และ Address", "NetID และ HostID"], "a": 3, "e": "หมายเลข IPv4 แบ่งโครงสร้างออกเป็น 2 ส่วนหลักคือ ส่วนระบุเครือข่าย (NetID) และส่วนระบุโฮสต์เครื่อง (HostID)"}, {"id": 256, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "จากข้อที่ 6 ส่วนประกอบสำคัญดังกล่าว ตรงกับข้อใด", "c": ["ซับเน็ตมาสก์ และดีฟอลต์ซับเน็ตมาสก์", "ชื่อโฮสต์ และตำแหน่งโฮสต์", "คลาส A และคลาส B", "NetID และ HostID (อ้างอิงโครงสร้างที่แยกแยะด้วย Subnet Mask)"], "a": 0, "e": "ซับเน็ตมาสก์ (Subnet Mask) ทำหน้าที่แบ่งแยกว่าส่วนใดคือ NetID และส่วนใดคือ HostID"}, {"id": 257, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "ฟิลด์ใดในไอพีดาตาแกรม ที่ป้องกันมิให้ดาตาแกรมเดินทางวนเวียนไปมาระหว่างเร้าเตอร์แบบไม่สิ้นสุด", "c": ["Unloop", "TTL (Time to Live)", "Fragmentation", "Version"], "a": 1, "e": "TTL (Time to Live) จะนับถอยหลังทุกครั้งที่แพ็กเก็ตผ่านเร้าเตอร์ หากหมดอายุจะถูกทำลายทิ้งป้องกันลูปวนไม่รู้จบ"}, {"id": 258, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "หมายเลขไอพีตามข้อใด จัดเป็น Loopback Address", "c": ["212.16.175.1", "127.0.0.1", "192.168.1.1", "ไม่มีข้อใดถูก"], "a": 1, "e": "หมายเลข 127.0.0.1 คือไอพีลูปแบ็ค (Loopback) ใช้ทดสอบระบบภายในเครื่องตัวเอง"}, {"id": 259, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "ข้อใดต่อไปนี้ เป็นคุณสมบัติของหมายเลขไอพีคลาส A", "c": ["มีจำนวนเครือข่ายมาก แต่ละเครือข่ายมีโฮสต์เชื่อมต่อน้อย", "มีจำนวนเครือข่ายปานกลาง แต่ละเครือข่ายมีโฮสต์เชื่อมต่อปานกลาง", "มีจำนวนเครือข่ายน้อย แต่ละเครือข่ายมีโฮสต์เชื่อมต่อมาก", "สามารถเป็นได้ทุกข้อ"], "a": 2, "e": "คลาส A ใช้บิตเน็ตไอวีน้อยทำให้มีจำนวนเน็ตเวิร์กน้อย แต่มีพื้นที่เหลือให้ใส่เครื่องลูกข่าย (Host) ได้จำนวนมหาศาลต่อเน็ตเวิร์ก"}, {"id": 260, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "ข้อใดต่อไปนี้ เป็นคุณสมบัติของหมายเลขไอพีคลาส B", "c": ["มีจำนวนเครือข่ายมาก แต่ละเครือข่ายมีโฮสต์เชื่อมต่อน้อย", "มีจำนวนเครือข่ายและโฮสต์ในระดับปานกลางอย่างละเท่าๆ กัน", "มีจำนวนเครือข่ายน้อย แต่ละเครือข่ายมีโฮสต์เชื่อมต่อมาก", "สามารถเป็นได้ทุกข้อ"], "a": 1, "e": "คลาส B ออกแบบมาให้สัดส่วนของจำนวนเครือข่ายและโฮสต์มีความสมดุลในระดับปานกลาง"}, {"id": 261, "cat": "เครือข่ายอินเทอร์เน็ต (Internet)", "q": "ข้อใดต่อไปนี้ เป็นคุณสมบัติของหมายเลขไอพีคลาส C", "c": ["มีจำนวนเครือข่ายมาก แต่ละเครือข่ายมีโฮสต์เชื่อมต่อน้อย (สูงสุด 254 เครื่อง)", "มีจำนวนเครือข่ายปานกลาง แต่ละเครือข่ายมีโฮสต์เชื่อมต่อปานกลาง", "มีจำนวนเครือข่ายน้อย แต่ละเครือข่ายมีโฮสต์เชื่อมต่อมาก", "สามารถเป็นได้ทุกข้อ"], "a": 0, "e": "คลาส C มีเน็ตเวิร์กไอ ฝ้าระวังความปลอดภัย"}, {"id": 302, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การกำหนดวันเวลาทำการให้แก่ระบบ ทำให้ผู้ใช้ไม่สามารถเข้าถึงเครือข่ายนอกเวลาทำการได้ จัดเป็นมาตรการความปลอดภัยด้านใด", "c": ["สภาพแวดล้อมภายนอก", "การปฏิบัติงาน", "การตรวจตราเฝ้าระวัง", "สิทธิการเข้าถึง (Access Control)"], "a": 3, "e": "การควบคุมเงื่อนไขเวลาและสิทธิ์การใช้งานจัดอยู่ในหมวดการควบคุมการเข้าถึงระบบ"}, {"id": 303, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การป้องกันความปลอดภัยในการเข้าถึงระบบข้อใด นิยมใช้งานมากที่สุด", "c": ["รหัสผ่าน (Password)", "ระบบโทรทัศน์วงจรปิด", "ระบบไบโอเมตริก", "ระบบตรวจสอบ"], "a": 0, "e": "รหัสผ่าน (Password) เป็นมาตรการยืนยันตัวตนขั้นพื้นฐานที่แพร่หลายและนิยมที่สุด"}, {"id": 304, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "ระบบป้องกันความปลอดภัยตามข้อใด ใช้คุณลักษณะเฉพาะของมนุษย์ที่ไม่สามารถลอกเลียนแบบได้", "c": ["รหัสผ่าน", "ระบบโทรทัศน์วงจรปิด", "ระบบไบโอเมตริก (Biometric Security)", "ระบบตรวจสอบ"], "a": 2, "e": "ไบโอเมตริกใช้ลักษณะทางกายภาพ เช่น สแกนลายนิ้วมือ ม่านตา หรือใบหน้า"}, {"id": 305, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การโจมตีด้วยวิธีใด มุ่งโจมตีระบบแบบเฉพาะเจาะจง", "c": ["Hacking Attacks", "Denial of Service Attacks", "Malware Attacks", "Virus Attacks"], "a": 0, "e": "Hacking มักเป็นการเจาะจงมุ่งเป้ายึดระบบหรือเจาะช่องโหว่เฉพาะเป้าหมาย"}, {"id": 306, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "DoS (Denial of Service) เป็นการโจมตีระบบในรูปแบบใด", "c": ["มุ่งทำลายเครือข่ายเฉพาะ เพื่อเข้าไปทำลายข้อมูล", "การปล่อยหนอนไวรัสแพร่ไปยังเครือข่าย", "มุ่งให้เซิร์ฟเวอร์ปฏิเสธการให้บริการ (ทำให้ระบบล่มด้วยปริมาณทราฟฟิกมหาศาล)", "ถูกทุกข้อ"], "a": 2, "e": "DoS โจมตีโดยการอัดคำขอเข้าเซิร์ฟเวอร์จนล้นระบบ ทำให้ผู้ใช้จริงใช้งานไม่ได้ (ปฏิเสธการให้บริการ)"}, {"id": 307, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การปล่อยหนอนไวรัส แพร่ไปยังเครือข่ายเพื่อขยายวงจรจนทำให้ระบบเครือข่ายติดขัด เป็นการโจมตีระบบด้วยวิธีใด", "c": ["Hacking Attacks", "Denial of Service / Malware Attacks", "Malware Attacks", "เป็นได้ทุกข้อ"], "a": 2, "e": "หนอนไวรัส (Worm) จัดเป็นมัลแวร์ที่แพร่กระจายอัตโนมัติสร้างความเสียหายหนักหน่วง"}, {"id": 308, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การโจมตีระบบด้วยวิธีใด ที่ส่งผลกระทบร้ายแรง ก่อให้เกิดผลกระทบในวงกว้าง", "c": ["Hacking Attacks", "Denial of Service Attacks", "Malware Attacks (มัลแวร์ / ไวรัส / เวิร์มกระจายวงกว้าง)", "ถูกทุกข้อ"], "a": 2, "e": "การโจมตีด้วยมัลแวร์มักแพร่กระจายอัตโนมัติสร้างความเสียหายเป็นวงกว้างทั่วองค์กรหรืออินเทอร์เน็ต"}, {"id": 309, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "ข่าวสารต้นฉบับที่อ่านได้อย่างเข้าใจ เรียกว่าอะไร", "c": ["Plaintext", "Cleartext", "Ciphertext", "ถูกทั้งข้อ ก. และ ข."], "a": 3, "e": "ข้อมูลดิบก่อนเข้ารหัสที่อ่านรู้เรื่องเรียกว่า Plaintext หรือ Cleartext"}, {"id": 310, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "ข่าวสารที่ได้รับการเข้ารหัส จำเป็นต้องนำสิ่งใดมาใช้งานร่วมด้วยเพื่อให้ถอดรหัสได้", "c": ["Ciphertext", "Encryption Algorithm", "Key (กุญแจถอดรหัส)", "ถูกทั้งข้อ ข. และ ค."], "a": 3, "e": "กระบวนการถอดรหัสต้องใช้ทั้งอัลกอริทึมและคีย์ลับที่ถูกต้อง"}, {"id": 311, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "ข่าวสารที่ถูกเข้ารหัสแล้ว เรียกว่าอะไร", "c": ["Ciphertext (ข้อความลับ)", "Plaintext", "Encryption Algorithm", "Key"], "a": 0, "e": "ข้อความที่แปลงสภาพจนอ่านไม่รู้เรื่องแล้วเรียกว่า Ciphertext"}, {"id": 312, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "เทคนิคการเข้ารหัสแบบใด ที่จะแทนที่อักขระเดิมไปเป็นอักขระใหม่ด้วยการจับคู่แบบคงที่", "c": ["Zigzag", "Transposition", "Substitution (การแทนที่)", "ไม่มีข้อถูก"], "a": 2, "e": "Substitution Cipher คือการสลับเปลี่ยนตัวอักษรทีละตัวตามกฎคงที่"}, {"id": 313, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การเข้ารหัสด้วยวิธี Rail Fence จัดเป็นการเข้ารหัสตามเทคนิคใด", "c": ["Ciphertext", "Transposition (การสลับตำแหน่ง)", "Substitution", "ไม่มีข้อถูก"], "a": 1, "e": "Rail Fence เป็นการสลับตำแหน่งตัวอักษรไขว้ไปมา (Transposition Cipher)"}, {"id": 314, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "การเข้ารหัสตามข้อใด มีการนำคีย์ (Key) มาใช้งานร่วมด้วย", "c": ["Rail Fence", "Polyalphabetic (เช่น Vigenère Cipher)", "Columnar Transposition (แบบมีคีย์เวิร์ดกำหนด)", "ถูกทั้งข้อ ข. และ ค."], "a": 3, "e": "การเข้ารหัสสมัยใหม่จะใช้คีย์ลับเข้ามาร่วมกำหนดทิศทางความปลอดภัย"}, {"id": 315, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "โปรแกรมเข้ารหัสและถอดรหัสใช้ชุดคีย์ชุดเดียวกันอยู่ในตัว จัดเป็นการเข้ารหัสตามรูปแบบใด", "c": ["Mono Cryptosystems", "Asymmetric Cryptosystems", "Symmetric Cryptosystems (ระบบสมมาตร)", "Digital Signatures"], "a": 2, "e": "Symmetric Cryptosystems ใช้กุญแจดอกเดียวกันทั้งเข้ารหัสและถอดรหัส"}, {"id": 316, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "เทคนิคการเข้ารหัสตามข้อใด ใช้กุญแจเข้ารหัสและกุญแจถอดรหัสคนละดอก โดยกุญแจที่นำมาเข้ารหัสจะนำมาถอดรหัสไม่ได้", "c": ["Mono Cryptosystems", "Asymmetric Cryptosystems (ระบบอสมมาตร / Public-Private Key)", "Symmetric Cryptosystems", "Digital Signatures"], "a": 1, "e": "Asymmetric Cryptosystems ใช้คู่กุญแจสาธารณะ (Public Key) และกุญแจส่วนตัว (Private Key) คู่กัน"}, {"id": 317, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "จากข้อที่ 17 ซอฟต์แวร์ตามข้อใด ได้นำแนวคิดดังกล่าวไปใช้เข้ารหัสอีเมลชื่อดัง", "c": ["Pretty Good Privacy (PGP)", "Program Good Privacy", "Protect Good Privacy", "Public Good Privacy"], "a": 0, "e": "PGP (Pretty Good Privacy) นำระบบกุญแจอสมมาตรมาใช้เข้ารหัสความปลอดภัยของอีเมล"}, {"id": 318, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "อุปกรณ์ไฟร์วอลล์ตามข้อใด ทำงานอยู่บนชั้นสื่อสารเน็ตเวิร์ก (Network Layer)", "c": ["Router", "Packet Filter Firewall", "Proxy Server", "ถูกทั้งข้อ ก. และ ข."], "a": 3, "e": "Packet Filter Firewall กรองข้อมูลระดับ IP Address ที่ชั้น Network Layer"}, {"id": 319, "cat": "ความปลอดภัยบนเครือข่าย (Network Security)", "q": "อุปกรณ์ไฟร์วอลล์ตามข้อใด ทำงานอยู่บนชั้นสื่อสารแอปพลิเคชัน (Application Layer)", "c": ["Router", "Packet Filter", "Proxy Server (Application Gateway)", "ไม่มีข้อถูก"], "a": 2, "e": "Proxy Server หรือ Application Gateway ทำงานลึกถึงชั้นแอปพลิเคชันเพื่อตรวจสอบเนื้อหาภายในแพ็กเก็ต"}];

const $=id=>document.getElementById(id); const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cats=[...new Set(QUESTIONS.map(x=>x.cat))]; $('cats').innerHTML=cats.map((c,i)=>`<button class="chip" data-i="${i}">${c}</button>`).join(''); document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{let c=cats[b.dataset.i];b.classList.toggle('on');S.cats.has(c)?S.cats.delete(c):S.cats.add(c)});
$('start').onclick=()=>{S.len=$('len').value;S.mode=$('mode').value;let pool=S.cats.size?QUESTIONS.filter(x=>S.cats.has(x.cat)):QUESTIONS;S.list=shuffle(pool).slice(0,S.len==='all'?pool.length:+S.len);begin(S.list)};
function begin(list){S.list=shuffle(list);S.i=0;S.answers=[];S.wrongList=[];S.locked=false;$('setup').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');render()}
function render(){let q=S.list[S.i];S.locked=false;$('qnum').textContent=`ข้อ ${S.i+1} / ${S.list.length}`;$('cat').textContent=q.cat;$('pct').textContent=`${Math.round((S.i/S.list.length)*100)}%`;$('bar').style.width=`${(S.i/S.list.length)*100}%`;$('question').textContent=q.q;$('feedback').innerHTML='';$('next').classList.add('hide');$('finish').classList.toggle('hide',S.mode!=='exam' || S.i!==S.list.length-1);let order=shuffle(q.c.map((_,i)=>i));S.order=order;$('choices').innerHTML=order.map(i=>`<button class="choice" data-i="${i}">${['ก','ข','ค','ง'][i]}. ${q.c[i]}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));}
function answer(p){if(S.locked)return;S.locked=true;let q=S.list[S.i];let ok=p===q.a;S.answers[S.i]={p,ok};document.querySelectorAll('.choice').forEach(b=>{let i=+b.dataset.i;b.classList.add('disabled');if(i===q.a)b.classList.add('correct');if(i===p&&!ok)b.classList.add('wrong')});if(S.mode==='instant'){$('feedback').innerHTML=`<div class="explain"><b>${ok?'✓ ตอบถูก':'✗ ตอบผิด'}</b><br>${q.e||'ไม่มีคำอธิบายเพิ่มเติมในข้อมูลต้นฉบับ'}</div>`;$('next').classList.remove('hide')}else if(S.i<S.list.length-1){$('next').classList.remove('hide')}else{$('finish').classList.remove('hide')}}
$('next').onclick=()=>{if(S.i<S.list.length-1){S.i++;render()}else finish()};$('finish').onclick=finish;
function finish(){S.wrongList=S.list.filter((q,i)=>!S.answers[i]||!S.answers[i].ok);let score=S.list.length-S.wrongList.length; $('quiz').classList.add('hide');$('result').classList.remove('hide');$('score').textContent=`${score} / ${S.list.length} (${Math.round(score/S.list.length*100)}%)`;$('summary').textContent=`ตอบถูก ${score} ข้อ • ตอบผิด/ไม่ตอบ ${S.wrongList.length} ข้อ`;
let m={};S.list.forEach((q,i)=>{if(!m[q.cat])m[q.cat]={t:0,c:0};m[q.cat].t++;if(S.answers[i]?.ok)m[q.cat].c++});$('breakdown').innerHTML='<h3>คะแนนรายหมวด</h3>'+Object.entries(m).map(([c,v])=>`<p><b>${c}</b> — ${v.c}/${v.t} (${Math.round(v.c/v.t*100)}%)</p>`).join('');$('wrong').innerHTML=S.wrongList.length?S.wrongList.map((q)=>{let i=S.list.indexOf(q);return `<div class="wrongItem"><b>ข้อ ${i+1}. ${q.q}</b><div class="small muted">${q.cat}</div><p>เฉลย: <b>${['ก','ข','ค','ง'][q.a]}. ${q.c[q.a]}</b></p><div class="explain">${q.e||'ไม่มีคำอธิบายเพิ่มเติมในข้อมูลต้นฉบับ'}</div></div>`}).join(''):'<p>🎉 ไม่มีข้อที่ตอบผิด</p>'}
$('retry').onclick=()=>{if(S.wrongList.length)begin(S.wrongList)};$('home').onclick=()=>{location.reload()};
</script></body></html>
