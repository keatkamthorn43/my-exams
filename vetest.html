/* ===== question builders ===== */
function mkChoice(topic,prompt,correct,wrongs,explain,ref){
  const w=[...new Set(wrongs)].filter(x=>x!==correct);
  const opts=shuffle([correct,...pick(w,3)]);
  return {kind:'choice',topic,prompt,options:opts,correct:opts.indexOf(correct),explain,ref};
}
const numField=(label,v,u,askUnit)=>({type:'num',label,pre:'ไม่เกิน',answers:[String(v)],unit:u,askUnit:!!askUnit,show:'ไม่เกิน '+v+' '+u});
const nameField=(label,r,show)=>({type:'text',label,pre:'',answers:r.al,show:show||r.full,ph:'พิมพ์ชื่อผู้บังคับบัญชา เช่น ผบ.กรม'});
const khField=label=>({type:'text',label,pre:'',answers:[KH,'ตามเห็นควร','ตามที่เห็นสมควร','ตามที่สมควร'],show:KH,ph:'พิมพ์ข้อความ'});
const typeByName=t=>TYPES.find(x=>x.id===t);

}
function qDef(){
  const t=pick(TYPES,1)[0];

}
function qTypeFill(){
  const t=pick(TYPES,1)[0];
  return {kind:'fill',topic:T_TYPE,prompt:'เติมชื่อประเภทการลาให้ถูกต้อง\n“'+t.mean+'”',
    fields:[{type:'text',label:'ประเภทการลา',pre:'การลา',answers:[...t.core,t.name,t.name.replace(/^ลา/,'')],show:t.name,ph:'พิมพ์ชื่อประเภทการลา'}],
    explain:'ประเภทการลาที่ถูกต้องคือ '+t.name+' ('+t.mean+')',ref:t.ref};
}
function qMatchTypes(){
  const ts=pick(TYPES,4);
  return {kind:'match',topic:T_TYPE,prompt:'จับคู่ความหมายกับประเภทการลาให้ถูกต้อง',pairs:ts.map(t=>({left:t.mean,right:t.name})),rights:shuffle(ts.map(t=>t.name)),
    explain:ts.map(t=>t.name+' = '+t.mean).join('\n'),ref:ts.map(t=>t.ref).join(', ')};

function mission1(){return shuffle([qScenario(),qScenario(),qScenario(),qDef(),qDef(),qDef(),qTypeFill(),qTypeFill(),qMatchTypes(),qMatchTypes()])}

/* mission 2 */
function numChoice(d,topic){
  const o=pick(NUMPOOL.filter(n=>n!==d.v),3).map(n=>n+' '+d.u);
  return mkChoice(topic||T_DAYS,d.l+' ลาได้ไม่เกินกี่ '+d.u+'?',d.v+' '+d.u,o,d.ex+' (หน่วยคือ '+d.u+')',d.ref);
}
function durFill(d,topic){
  return {kind:'fill',topic:topic||T_DAYS,prompt:d.l+'\nเติมจำนวนและหน่วยให้ถูกต้อง',fields:[numField('จำนวนที่ลาได้',d.v,d.u,true)],explain:d.ex+' (หน่วยคือ '+d.u+')',ref:d.ref};
}
function durMatch(){
  const ds=pick(DUR.filter(d=>['help','biz','vac','ord','haj','birth','sp','rehab'].includes(d.t)),4);
  const rs=ds.map(d=>d.v+' '+d.u);
  if(new Set(rs).size<4) return durMatch();
  return {kind:'match',topic:T_DAYS,prompt:'จับคู่การลากับจำนวนวัน/หน่วยที่ลาได้ไม่เกิน',pairs:ds.map(d=>({left:d.l,right:d.v+' '+d.u})),rights:shuffle(rs),explain:ds.map(d=>d.l+' = ไม่เกิน '+d.v+' '+d.u+' ('+d.ref+')').join('\n'),ref:[...new Set(ds.map(d=>d.ref))].join(', ')};
}

function fieldOk(f,x){
  if(!x||!String(x.v).trim())return false;
  const parts=f.type==='text'?x.v.split(/[\/;|\n]|และ/):[x.v];
  const okV=parts.some(p=>{const n=norm(p);if(!n)return false;
    if(f.type==='num'){return /^\d+$/.test(n)&&Number(n)===Number(f.answers[0])}
    return f.answers.some(a=>norm(a)===n)});
  return okV&&(!f.askUnit||x.u===f.unit);
}
function judge(q,r){
  if(q.kind==='choice')return{ok:r===q.correct,per:null};
  if(q.kind==='match'){const per=q.pairs.map((p,i)=>r[i]===p.right);return{ok:per.every(Boolean),per}}
  const per=q.fields.map((f,i)=>fieldOk(f,r[i]));return{ok:per.every(Boolean),per};
}
function ansText(q){
  if(q.kind==='choice')return q.options[q.correct];
  if(q.kind==='match')return q.pairs.map(p=>p.left+' → '+p.right).join('\n');

}

  }else{
    G.streak=0;noteWrong(q);
    msg=`<div class="fb bad"><b>${revealed?'เฉลย':'ยังไม่ถูกต้อง'}</b>\nคำตอบที่ถูกต้อง:\n${esc(ansText(q))}\n\n${esc(q.explain)}\n<span class="ref">อ้างอิง: ${esc(q.ref)}</span></div>`;
  }
  topicStat(q.topic,ok);G.log.push({q,ok,r});save();
  mark(q,j,r);$('fb').innerHTML=msg;
  $('ctl').innerHTML=`<button class="btn pri" data-act="next">${G.i+1<G.qs.length?'ข้อต่อไป':'ดูผลภารกิจ'}</button><button class="btn" data-act="restart">เริ่มใหม่</button><button class="btn" data-act="home">กลับหน้าแรก</button>`;
  const hb=document.querySelector('.hud .row');if(hb&&!G.exam)hb.innerHTML=`<span class="pill">ข้อ ${G.i+1}/${G.qs.length}</span><span class="pill">คะแนน ${G.score}</span><span class="pill">ติดต่อกัน ${G.streak}</span>`;
}
/* ===== exam flow, results ===== */
function recordExam(q){
  const r=collect(q),j=judge(q,r);
  topicStat(q.topic,j.ok);
  if(j.ok){G.correct++;G.score+=10;S.totalCorrect++;if(G.reexam)delete S.wrong[qkey(q)]}else noteWrong(q);
  G.log.push({q,ok:j.ok,r});
}
function timeUp(){
  if(!G||G.finished)return;
  if(document.getElementById('fb')&&!G.done&&G.i<G.qs.length){try{recordExam(G.qs[G.i])}catch(e){G.log.push({q:G.qs[G.i],ok:false});noteWrong(G.qs[G.i])}}
  for(let k=G.log.length;k<G.qs.length;k++){const q=G.qs[k];topicStat(q.topic,false);noteWrong(q);G.log.push({q,ok:false,r:null,skipped:true})}
  results(true);
}
function results(timeout){
  stopTimer();G.finished=true;
  const tot=G.qs.length,ok=G.correct,pct=ok/tot*100;
  const track=!G.review&&!G.reexam;
  if(track){
    const s=S.m[G.n]||(S.m[G.n]={best:0,done:false,att:0,medal:'none'});
    s.att++;s.best=Math.max(s.best||0,pct);if(pct>=60)s.done=true;s.medal=medalOf(s.best);
  }
  S.best=Math.max(S.best,G.score);save();
  const wr=G.log.filter(x=>!x.ok);
  const bad={};wr.forEach(x=>{bad[x.q.topic]=(bad[x.q.topic]||0)+1});
  const pass=pct>=60;
  const nextOk=track&&G.n<5&&pass;
  app.innerHTML=`<div class="hero"><div class="tag">${esc(G.title)}${timeout?' · หมดเวลา':''}</div>
  <div class="big">${Math.round(pct)}%</div><h2>${rankTitle(pct)}</h2>
  <p class="mut">${track?(pass?'ผ่านภารกิจ ได้รับ'+medalName[medalOf(pct)]+(G.n<5?' และปลดล็อกด่านถัดไป':''):'ยังไม่ผ่านเกณฑ์ 60% ลองอีกครั้ง'):'โหมดฝึกข้อที่เคยผิด'}</p></div>
  <div class="stats"><div class="stat"><b>${G.score}</b><span>คะแนนรวม</span></div><div class="stat"><b>${ok}</b><span>ตอบถูก (ข้อ)</span></div><div class="stat"><b>${tot-ok}</b><span>ตอบผิด (ข้อ)</span></div></div>
  ${G.exam?'<p class="mut">ข้อสอบจำลองให้ 10 คะแนนต่อข้อที่ถูก ไม่มีโบนัส</p>':''}
  ${Object.keys(bad).length?`<h3>หัวข้อที่ควรกลับไปทบทวน</h3><p>${Object.keys(bad).map(t=>esc(t)+' ('+bad[t]+' ข้อ)').join(' · ')}</p>`:'<p>ไม่มีข้อผิดในรอบนี้ ยอดเยี่ยม</p>'}
  ${wr.length?`<h3 style="margin-top:14px">ข้อที่ตอบผิด พร้อมเฉลย</h3><div class="list">${wr.map(x=>wrongItem(x.q,x.skipped)).join('')}</div>`:''}
  <div class="row" style="margin:18px 0"><button class="btn pri" data-act="again">เล่นอีกครั้ง</button>${nextOk?`<button class="btn pri" data-act="start" data-n="${G.n+1}">ภารกิจถัดไป</button>`:''}<button class="btn" data-act="notebook">สมุดบันทึกข้อผิดพลาด</button><button class="btn" data-act="home">กลับหน้าแรก</button></div>`;
}
const wrongItem=(q,skipped)=>`<div class="item"><div class="chip">${esc(q.topic)}${skipped?' · ไม่ได้ตอบ':''}</div><p class="prompt" style="font-size:1rem">${esc(q.prompt)}</p><p><b>เฉลย:</b> <span style="white-space:pre-line">${esc(ansText(q))}</span></p><p class="mut" style="white-space:pre-line">${esc(q.explain)}</p><p class="ref">อ้างอิง: ${esc(q.ref)}</p></div>`;

/* ===== notebook ===== */
function notebook(){
  stopTimer();G=null;
  const ws=Object.values(S.wrong);
  const tb=TOPICS.map(t=>{const o=S.topics[t]||{r:0,w:0},n=o.r+o.w,p=n?Math.round(o.r/n*100):0;
    const st=!n?'ยังไม่มีข้อมูล':p>=80?'จำได้ดี':p>=60?'พอใช้':'ยังสับสน';
    return `<div class="tb"><span>${esc(t)} <span class="mut">(${o.r}/${n})</span></span><b class="fd">${n?p+'%':'-'} · ${st}</b><div class="bar" style="grid-column:1/-1"><i style="width:${p}%"></i></div></div>`}).join('');
  app.innerHTML=`<div class="hero"><div class="tag">Field Notebook</div><h1>สมุดบันทึกข้อผิดพลาด</h1></div>
  <div class="row" style="margin:12px 0"><button class="btn pri" data-act="review" ${ws.length?'':'disabled'}>ฝึกเฉพาะข้อที่เคยตอบผิด</button><button class="btn" data-act="reexam" ${ws.length?'':'disabled'}>สุ่มทำข้อสอบซ้ำ (จับเวลา)</button><button class="btn" data-act="home">กลับหน้าแรก</button></div>
  <h3>สถิติการจำแยกตามหัวข้อ</h3><div class="item">${tb}</div>
  <h3 style="margin-top:16px">ข้อที่เคยตอบผิด (${ws.length})</h3>
  <div class="list">${ws.length?ws.map(w=>wrongItem(w.q)+'').join(''):'<div class="item">ยังไม่มีข้อที่ตอบผิด</div>'}</div>`;
}

/* ===== hint ===== */
function hintText(q){
  if(q.kind==='match'){const p=q.pairs[0];return 'คู่แรก: '+p.left+' → '+p.right}
  const hs=q.fields.map((f,i)=>{
    if(f.type==='num')return (f.label||'ช่อง '+(i+1))+': ตัวเลขมี '+f.answers[0].length+' หลัก ขึ้นต้นด้วย '+f.answers[0][0]+(f.unit?' หน่วย'+(f.askUnit?'เป็น “'+f.unit.slice(0,2)+'…”':f.unit):'');
    const s=String(f.show);return (f.label||'ช่อง '+(i+1))+': ขึ้นต้นด้วย “'+s.slice(0,Math.min(6,s.length))+'…”'});
  return hs.slice(0,4).join('\n');
}

/* ===== actions ===== */
const ACT={
  start:d=>{const n=+d.n;if(!acked){gate(n);return}begin(n)},
  ack:d=>{acked=true;const g=$('gate');if(g)g.remove();begin(+d.n)},
  pick:d=>{if(G.done)return;G.sel=+d.i;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===+d.i))},
  check:()=>{const q=G.qs[G.i];const r=collect(q);if(q.kind==='choice'&&r==null){$('fb').innerHTML='<div class="fb">เลือกคำตอบก่อนกดตรวจ</div>';return}settle(q,judge(q,r),r,false)},
  hint:()=>{const q=G.qs[G.i];if(G.done)return;G.hint=true;
    if(q.kind==='choice'){const wrong=q.options.map((o,i)=>i).filter(i=>i!==q.correct);pick(wrong,2).forEach(i=>{const b=document.querySelectorAll('.opt')[i];b.classList.add('off');b.disabled=true});$('hint').hidden=false;$('hint').textContent='ตัดตัวเลือกที่ผิดออก 2 ข้อแล้ว (ไม่ได้รับโบนัสไม่ใช้คำใบ้)'}
    else{$('hint').hidden=false;$('hint').style.whiteSpace='pre-line';$('hint').textContent='คำใบ้ (ไม่ได้รับโบนัสไม่ใช้คำใบ้)\n'+hintText(q)}},
  reveal:()=>{const q=G.qs[G.i];if(G.done)return;const r=collect(q);settle(q,judge(q,r),r,true)},
  next:()=>{if(G.i+1<G.qs.length){G.i++;play()}else results(false)},
  examNext:()=>{const q=G.qs[G.i];recordExam(q);save();if(G.i+1<G.qs.length){G.i++;play()}else{G.done=true;results(false)}},
  restart:(d,b)=>{if(!b.dataset.sure){b.dataset.sure='1';b.textContent='กดอีกครั้งเพื่อยืนยันเริ่มใหม่';return}begin(G.n,G.opts)},
  again:()=>{begin(G.n,G.opts)},
  home:(d,b)=>{if(G&&!G.finished&&G.log.length&&!b.dataset.sure){b.dataset.sure='1';b.textContent='กดอีกครั้งเพื่อออก (ความคืบหน้ารอบนี้จะหาย)';return}home()},
  notebook:()=>notebook(),
  review:()=>begin(0,{review:true}),
  reexam:()=>begin(0,{reexam:true}),
  reset:(d,b)=>{if(!b.dataset.sure){b.dataset.sure='1';b.textContent='กดอีกครั้งเพื่อล้างทั้งหมด';return}S=fresh();save();home()}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)ACT[b.dataset.act](b.dataset,b)});
document.addEventListener('click',e=>{const b=e.target.closest('#gate [data-act]');if(b)ACT[b.dataset.act](b.dataset,b)});
home();
</script>

</body></html>
