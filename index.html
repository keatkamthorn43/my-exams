<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังข้อสอบ — เลือกรายวิชา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152238; --navy-2:#1e3151; --paper:#f6f3ec;
  --ink:#20242b; --ink-soft:#5b616d; --brass:#a67c2e; --brass-l:#c99a44;
  --rule:#ded7c7; --card:#ffffff;
  --shadow:0 1px 3px rgba(21,34,56,.08);
  --shadow-lg:0 10px 26px rgba(21,34,56,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Sarabun',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Noto Serif Thai',serif;color:var(--navy);line-height:1.4;margin:0}
a{color:inherit;text-decoration:none}

/* ---- header ---- */
header{background:var(--navy);color:#fff;padding:44px 0 40px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.badge{width:46px;height:46px;border-radius:50%;background:linear-gradient(155deg,var(--brass-l),var(--brass));
  color:var(--navy);display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif Thai',serif;font-weight:800;font-size:15px;margin-bottom:16px;
  box-shadow:0 3px 8px rgba(0,0,0,.25)}
header .kicker{font-size:13px;color:var(--brass-l);font-weight:600;letter-spacing:.03em;margin-bottom:10px}
header h1{color:#fff;font-size:30px;margin-bottom:10px}
header p{margin:0;color:#a6b0c4;font-size:15px;max-width:560px}

/* ---- grid ---- */
main{padding:40px 0 90px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
  gap:20px;
}
.card{
  background:var(--card);border-radius:14px;padding:24px;
  box-shadow:var(--shadow);border:1px solid var(--rule);
  display:flex;flex-direction:column;gap:14px;
  transition:transform .18s, box-shadow .18s;position:relative;overflow:hidden;
}
.card.active{cursor:default}
.card.active:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card.disabled{opacity:.62}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.icon{
  width:46px;height:46px;border-radius:11px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:#eee7d4;color:var(--navy);
}
.card.active .icon{background:linear-gradient(155deg,var(--brass-l),var(--brass));color:#fff}
.icon svg{width:24px;height:24px}

.tag{
  font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:4px 10px;border-radius:20px;white-space:nowrap;height:fit-content;
}
.tag.ready{background:#e8f3ec;color:#2f6b4f}
.tag.soon{background:#efeade;color:#8a7539}

.card h2{font-size:18px;margin:0}
.card .num{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.card p.desc{margin:0;color:var(--ink-soft);font-size:13.8px;flex:1}

.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.btn{
  border:none;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;
}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--rule)}
.btn.ghost:hover{background:#efeade}
.btn.disabled{background:#e7e2d4;color:#9d9884;cursor:not-allowed;pointer-events:none}

footer{border-top:1px solid var(--rule);padding:26px 0 50px;color:var(--ink-soft);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:520px){
  header h1{font-size:24px}
  main{padding:30px 0 70px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="badge">ข้อสอบ</div>
    <div class="kicker">คลังข้อสอบ · สำหรับเตรียมสอบ</div>
    <h1>เลือกรายวิชาที่ต้องการฝึกทำข้อสอบ</h1>
    <p>รวมชีทอ่านสอบและข้อสอบจำลองแยกตามรายวิชา เลือกวิชาด้านล่างเพื่อเริ่มทำข้อสอบ หรืออ่านสรุปทบทวนก่อนสอบ</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>อัปเดตล่าสุด: วิชา พ.ร.บ.ตำรวจแห่งชาติ พ.ศ. 2565 (100 ข้อ)</span>
    <span>วิชาที่เหลือกำลังทยอยเพิ่มเข้ามา</span>
  </div>
</footer>

<script>
const SUBJECTS = [
  {
    name: "ไซเบอร์",
    desc: "ความมั่นคงปลอดภัยไซเบอร์ การโจมตีทางไซเบอร์ และแนวทางป้องกันภัยคุกคาม",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.6 8 9 4.6-.4 8-4 8-9V5l-8-3Z"/><path d="M9.5 12.3 11.3 14l3.7-4"/></svg>`,
    ready: true, quiz: "infosec-quiz.html", sheet: null, count: "ข้อสอบ 166 ข้อ"
  },
  {
    name: "เครือข่ายคอมพิวเตอร์",
    desc: "โครงสร้างเครือข่าย โปรโตคอล การสื่อสารข้อมูล และอุปกรณ์เครือข่าย",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M12 7.4V12M12 12 6.6 16M12 12l5.4 4"/></svg>`,
    ready: true, quiz: "net-act-quiz.html", sheet: null, count: "ข้อสอบ 319 ข้อ"
  },
  {
    name: "โปรแกรม",
    desc: "หลักการเขียนโปรแกรม ตรรกะ อัลกอริทึม และภาษาโปรแกรมพื้นฐาน",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-5 6 5 6M16 6l5 6-5 6M13.5 4 10.5 20"/></svg>`,
    ready: false, quiz: null, sheet: null, count: null
  },
  {
    name: "ระบบปฏิบัติการคอมพิวเตอร์",
    desc: "หลักการทำงานของ OS การจัดการหน่วยความจำ โปรเซส และไฟล์ระบบ",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`,
    ready: false, quiz: null, sheet: null, count: null
  },
  {
    name: "พ.ร.บ.ตำรวจแห่งชาติ",
    desc: "พ.ร.บ.ตำรวจแห่งชาติ พ.ศ. 2565 มาตรา 1–181 ครบทุกหมวด",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 4 6 6M6.5 11.5l6-6 4 4-6 6-4-4ZM8 14l-5 5M3 21h6"/><circle cx="18" cy="6" r="1.6"/></svg>`,
    ready: true, quiz: "police-act-2565-quiz.html", sheet: "police-act-2565-study-sheet.html", count: "ข้อสอบ 100 ข้อ"
  },
  {
    name: "พ.ร.บ.ไซเบอร์",
    desc: "พระราชบัญญัติการรักษาความมั่นคงปลอดภัยไซเบอร์ อำนาจหน้าที่ และบทกำหนดโทษ",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
    ready: true, quiz: "cyber-act-quiz.html", sheet: "pdf/sheetCyber.pdf", count: "ข้อสอบ 150 ข้อ"
  },
  {
    name: "พ.ร.บ.คอมพิวเตอร์ & PDPA",
    desc: "พ.ร.บ.ว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ พ.ศ. 2550 และแก้ไขเพิ่มเติม พ.ศ. 2560",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><circle cx="12.5" cy="14" r="2.2"/><path d="M12.5 16.2V18"/></svg>`,
    ready: true, quiz: "computer-crime-act-quiz.html", sheet: null, count: "ข้อสอบ 106 ข้อ"
  },
  {
    name: "เกมส์ช่วยจำระเบียบการลา",
    desc: "สร้างเกมฝึกจำข้อบังคับกระทรวงกลาโหมว่าด้วยการลา พ.ศ. 2555",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><circle cx="12.5" cy="14" r="2.2"/><path d="M12.5 16.2V18"/></svg>`,
    ready: true, quiz: "vetest.html", sheet: null, count: "ข้อสอบ 5 ข้อ"
  },
     {
    name: "คอมพิวเตอร์สาย อก.",
    desc: "ข้อสอบวิชาคอมพิวเตอร์จำนวน 100 ข้อ",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><circle cx="12.5" cy="14" r="2.2"/><path d="M12.5 16.2V18"/></svg>`,
    ready: true, quiz: "itpolice.html", sheet: null, count: "ข้อสอบ 100 ข้อ"
  }
];

const grid = document.getElementById('grid');
SUBJECTS.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card ' + (s.ready ? 'active' : 'disabled');

  const tag = s.ready
    ? `<span class="tag ready">พร้อมใช้งาน</span>`
    : `<span class="tag soon">เร็วๆ นี้</span>`;

  const actions = s.ready
    ? `<a class="btn primary" href="${s.quiz}">เริ่มทำข้อสอบ</a>` +
      (s.sheet ? `<a class="btn ghost" href="${s.sheet}">อ่านชีทสรุป</a>` : '')
    : `<span class="btn disabled">ยังไม่เปิดใช้งาน</span>`;

  card.innerHTML = `
    <div class="top">
      <div class="icon">${s.icon}</div>
      ${tag}
    </div>
    <div>
      <h2>${s.name}</h2>
      ${s.count ? `<div class="num">${s.count}</div>` : ''}
    </div>
    <p class="desc">${s.desc}</p>
    <div class="actions">${actions}</div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
